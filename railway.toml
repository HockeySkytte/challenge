# Railway configuration.
#
# Railpack auto-detects Python from requirements.txt, so there is no build
# override here.  The start command runs the app under gunicorn, and Railway's
# healthcheck hits /healthz.

[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 100
